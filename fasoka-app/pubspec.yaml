name: fasoka
description: Marketplace fintech pour commerçants informels à Lomé, Togo.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2          # gestion d'état
  http: ^1.2.1               # appels API
  shared_preferences: ^2.2.3 # stocker le token JWT localement
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  intl: ^0.19.0               # formatage prix / dates
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
